services:
  backend:
    container_name: ${SCENARIO_NAME}_erpnext_backend_container
    build:
      context: .
      args:
        FRAPPE_VERSION: ${SCENARIO_FRAPPE_VERSION:-version-16}
        FRAPPE_PATH: ${SCENARIO_FRAPPE_PATH:-https://github.com/frappe/frappe}
        ERPNEXT_VERSION: ${SCENARIO_ERPNEXT_VERSION:-version-16}
        ERPNEXT_REPO: ${SCENARIO_ERPNEXT_REPO:-https://github.com/frappe/erpnext}
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SCENARIO_SERVER_CONFIGSDIR}:${SCENARIO_SERVER_CONFIGSDIR}
    networks:
      - erpnext_network

  configurator:
    container_name: ${SCENARIO_NAME}_erpnext_configurator_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    restart: "no"
    entrypoint:
      - bash
      - -c
    # add redis_socketio for backward compatibility
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
      - ${SCENARIO_SERVER_CONFIGSDIR}:${SCENARIO_SERVER_CONFIGSDIR}
    networks:
      - erpnext_network

  create-site:
    container_name: ${SCENARIO_NAME}_erpnext_create-site_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    restart: "no"
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
      - ./install_upgrade_apps.sh:/tmp/install_upgrade_apps.sh
      - ./apps.json:/tmp/apps.json:ro
      - ./direct_wildcard_fix.sh:/tmp/direct_wildcard_fix.sh
      - ./fix-git-refs.sh:/tmp/fix-git-refs.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SCENARIO_SERVER_CONFIGSDIR}:${SCENARIO_SERVER_CONFIGSDIR}
      - ${SCENARIO_DATA_BACKUPDIR}:/home/frappe/frappe-bench/backups
      - ${SCENARIO_SRC_SECRETSDIR}/.ssh:/home/frappe/.ssh-host:ro
      # Clean Unit: Administrator-Kennwort der Site kommt aus einer Datei auf dem Host
      # (von Units/host/setup-host.sh zufaellig erzeugt), nicht mehr fest "admin".
      - ${SCENARIO_SRC_SECRETSDIR}/admin_password:/run/secrets/erp_admin_password:ro
    environment:
      DB_HOST: db
      DB_ROOT_USER: ${DB_ROOT_USER}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      FRAPPE_VERSION: ${SCENARIO_FRAPPE_VERSION:-version-16}
      FRAPPE_PATH: ${SCENARIO_FRAPPE_PATH:-https://github.com/frappe/frappe}
      ERPNEXT_VERSION: ${SCENARIO_ERPNEXT_VERSION:-version-16}
      ERPNEXT_REPO: ${SCENARIO_ERPNEXT_REPO:-https://github.com/frappe/erpnext}
      DEVELOPER_MODE: ${SCENARIO_ERPNEXT_DEVELOPERMODE:-true}
    entrypoint:
      - bash
      - -c
    command:
      - >
        rm -rf /home/frappe/.ssh;
        cp -r /home/frappe/.ssh-host /home/frappe/.ssh;
        chmod 700 /home/frappe/.ssh;
        find /home/frappe/.ssh -type f -exec chmod 600 {} \;;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        SITE_NAME="${SCENARIO_SITE_NAME}";
        EXISTING_DEFAULT=$$(grep -oP '"default_site":\s*"\K[^"]+' sites/common_site_config.json 2>/dev/null || echo "");
        if [ -n "$$EXISTING_DEFAULT" ]; then echo "Using existing default site: $$EXISTING_DEFAULT"; SITE_NAME="$$EXISTING_DEFAULT"; fi;
        if [ ! -f sites/$$SITE_NAME/site_config.json ]; then
          if [ ! -f /run/secrets/erp_admin_password ] || [ ! -s /run/secrets/erp_admin_password ]; then
            echo "FEHLER: Administrator-Kennwort fehlt (${SCENARIO_SRC_SECRETSDIR}/admin_password) - zuerst Units/host/setup-host.sh ausfuehren";
            exit 1;
          fi;
          bench new-site --no-mariadb-socket --admin-password="$$(cat /run/secrets/erp_admin_password)" --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --set-default $$SITE_NAME;
        else echo "Site $$SITE_NAME already exists, skipping new-site"; fi;
        cp -f /tmp/install_upgrade_apps.sh /home/frappe/frappe-bench/install_upgrade_apps.sh;
        chmod +x /home/frappe/frappe-bench/install_upgrade_apps.sh;
        cp -f /tmp/fix-git-refs.sh /home/frappe/frappe-bench/fix-git-refs.sh;
        chmod +x /home/frappe/frappe-bench/fix-git-refs.sh;
        /home/frappe/frappe-bench/install_upgrade_apps.sh $$SITE_NAME ${SCENARIO_INSTALL_APPS};
        cp -f /tmp/direct_wildcard_fix.sh /home/frappe/frappe-bench/direct_wildcard_fix.sh;
        chmod +x /home/frappe/frappe-bench/direct_wildcard_fix.sh;
        /home/frappe/frappe-bench/direct_wildcard_fix.sh
    networks:
      - erpnext_network

  db:
    container_name: ${SCENARIO_NAME}_erpnext_db_container
    image: mariadb:10.6
    healthcheck:
      test: mysqladmin ping -h localhost --password=$$MYSQL_ROOT_PASSWORD
      interval: 1s
      retries: 20
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_7}:/var/lib/mysql
    networks:
      - erpnext_network

  frontend:
    container_name: ${SCENARIO_NAME}_erpnext_frontend_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - FRAPPE_HOST_NAME=https://${SCENARIO_TRAEFIK_URL}
      - FRAPPE_WEBSERVER_ROOT=${SCENARIO_TRAEFIK_ROUTE}
      - BACKEND=backend:8000
      - FRONTEND_PORT=8080
      - FRAPPE_SITE_NAME_HEADER=${SCENARIO_SITE_NAME}
      - SOCKETIO=websocket:9000
      - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
      - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
      - UPSTREAM_REAL_IP_RECURSIVE=off
      - PROXY_READ_TIMEOUT=120
      - CLIENT_MAX_BODY_SIZE=50m
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SCENARIO_SERVER_CONFIGSDIR}:${SCENARIO_SERVER_CONFIGSDIR}
      - ${SCENARIO_SRC_SECRETSDIR}/.ssh:/home/frappe/.ssh-host:ro
    entrypoint:
      - bash
      - -c
    command:
      - >
        rm -rf /home/frappe/.ssh;
        cp -r /home/frappe/.ssh-host /home/frappe/.ssh;
        chmod 700 /home/frappe/.ssh;
        find /home/frappe/.ssh -type f -exec chmod 600 {} \;;
        exec nginx-entrypoint.sh
    networks:
      - erpnext_network

  queue-long:
    container_name: ${SCENARIO_NAME}_erpnext_queue-long_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
    networks:
      - erpnext_network

  queue-short:
    container_name: ${SCENARIO_NAME}_erpnext_queue-short_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
    networks:
      - erpnext_network

  redis-queue:
    container_name: ${SCENARIO_NAME}_erpnext_redis-queue_container
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_5}:/data
    networks:
      - erpnext_network

  redis-cache:
    container_name: ${SCENARIO_NAME}_erpnext_redis-cache_container
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    command: redis-server --maxmemory-policy allkeys-lru
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_6}:/data
    networks:
      - erpnext_network

  scheduler:
    container_name: ${SCENARIO_NAME}_erpnext_scheduler_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    restart: unless-stopped
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    entrypoint:
      - bash
      - -c
    command:
      - >
        echo "⏳ Waiting for bench initialization...";
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
        done;
        echo "✅ Bench initialized. Starting scheduler...";
        bench schedule
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
    networks:
      - erpnext_network

  websocket:
    container_name: ${SCENARIO_NAME}_erpnext_websocket_container
    image: ${SCENARIO_NAME}_erpnext_image
    pull_policy: never
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - ${SCENARIO_DATA_MOUNTPOINT_1}:/home/frappe/frappe-bench/env
      - ${SCENARIO_DATA_MOUNTPOINT_2}:/home/frappe/frappe-bench/apps
      - ${SCENARIO_DATA_MOUNTPOINT_3}:/home/frappe/frappe-bench/sites
      - ${SCENARIO_DATA_MOUNTPOINT_4}:/home/frappe/frappe-bench/logs
      - ${SCENARIO_DATA_MOUNTPOINT_8}:/home/frappe/frappe-bench/sites/assets
    networks:
      - erpnext_network

networks:
  erpnext_network:
    driver: bridge
    name: ${SCENARIO_NAME}_erpnext_network
