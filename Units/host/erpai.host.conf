# erpai.host.conf — Rahmenbedingungen fuer setup-host.sh (ERP AI, Szenarien de/matthiaskittner/ki)
# Keine Zugangsdaten in dieser Datei. Kennwoerter und Schluessel erzeugt setup-host.sh
# auf dem Server unter ${SECRETS_DIR}; im Repo stehen nur Pfade und Namen.
#
# Zielserver ki.netcup (Entscheidung nach Servercheck 21.10.2026, README §4), Domains *.ki.matthiaskittner.de
# (Matthias, 22.10.2026), Namensraum de/matthiaskittner/ki wie die anderen Szenarien dort.
# Soll das Ganze auf einen anderen Server: diese Datei, Scenarios/de/matthiaskittner/ki/*.scenario.env,
# Jenkins/Jenkinsfile.* und ssh-config.example anpassen (README §5).

# SSH-Config-Name, unter dem der Server erreichbar ist (Szenarien: SCENARIO_SERVER_SSHCONFIG)
SSHCONFIG_DEFAULT="ki.netcup"

# Ablage auf dem Server (Szenarien: SCENARIO_SERVER_CONFIGSDIR, SCENARIO_DATA_BACKUPDIR, SCENARIO_SRC_SECRETSDIR)
BASE_DIR="/var/dev/MIMS-Scenarios"
BACKUP_DIR="${BASE_DIR}/_backups"
SECRETS_DIR="${BASE_DIR}/_secrets"
FRAPPE_SECRETS_DIR="${SECRETS_DIR}/frappe"      # .ssh/ (Deploy-Key) und admin_password
TRAEFIK_SECRETS_DIR="${SECRETS_DIR}/traefik"    # dashboard_password (Klartext, nur root)
JENKINS_SECRETS_DIR="${SECRETS_DIR}/jenkins"    # host-ssh-key (Jenkins -> Host), Repo-Key, Customer-Token

# Namen, die auf den Server zeigen muessen (Traefik holt dafuer Zertifikate)
DOMAINS="erpai.ki.matthiaskittner.de erpai-stage.ki.matthiaskittner.de erpai-dev.ki.matthiaskittner.de erpai-jenkins.ki.matthiaskittner.de traefik.ki.matthiaskittner.de"

# Private App, die der ERPNext-Container per Deploy-Key holt
APP_REPO="mkt1/erp_ai_app"
APP_REPO_SSH="git@github.com:${APP_REPO}.git"
APP_REPO_KEYS_URL="https://github.com/${APP_REPO}/settings/keys"
DEPLOY_KEY_NAME="id_ed25519_erp_ai_app"
# Weitere private App-Repos aus apps.json: je Repo ein eigener Deploy-Key (GitHub erlaubt einen Key nur an einem
# Repo) und ein SSH-Alias github_<name>, den die apps.json als Host nutzt (git@github_<name>:<owner>/<name>.git)
EXTRA_PRIVATE_APPS="schmidtundtoechter/sut_app_tax"

# Dieses Repo (Jenkinsfiles, Szenarien, Komponente) — Jenkins liest es per Deploy-Key
INFRA_REPO="mkt1/erp_ai_infrastructure"

# Jenkins-Container (Szenario jenkins → <name>_jenkins_container)
JENKINS_CONTAINER="erpai-jenkins_jenkins_container"
JENKINS_URL="https://erpai-jenkins.ki.matthiaskittner.de/jenkins/"

# Szenarien, die ausgerollt werden (Reihenfolge = Startreihenfolge)
SCENARIO_NAMESPACE="de/matthiaskittner/ki"
SCENARIOS="erpai erpai-stage erpai-dev erpai-jenkins"
# Nur auf einem eigenen Server ohne Reverse Proxy (ki.netcup und kittner.netcup haben schon einen):
SCENARIOS_OPTIONAL="traefik"

# Mindestgroesse fuer Traefik + Jenkins + drei ERPNext-Instanzen
MIN_RAM_MB=10000
MIN_CPUS=4
MIN_DISK_GB=80

# Benutzer-ID von 'frappe' im ERPNext-Image — liest Deploy-Key und Admin-Kennwort
FRAPPE_UID=1000

# Customer-Umgebung: Jenkins-Benutzer, der den Deploy-Job anstossen darf (ERPAI_JENKINS_USER)
CUSTOMER_JENKINS_USER="customer"
# Developer-Umgebung: Jenkins-Administrator, den setup-jenkins-init.sh statt des Einrichtungsassistenten anlegt
DEVELOPER_JENKINS_USER="developer"
# Plugins, die die Jenkinsfiles und die Setup-Skripte brauchen (jenkins-plugin-cli, Abhaengigkeiten kommen mit)
JENKINS_PLUGINS="workflow-aggregator git credentials ssh-credentials credentials-binding plain-credentials mailer"
